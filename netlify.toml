[build]
  publish = "dist"
  functions = "netlify/functions"
  command = "npm run build"

[functions]
  node_bundler = "esbuild"

# Route /api/gemini/chat to Netlify serverless function
[[redirects]]
  from = "/api/gemini/chat"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

# SPA fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
